name: Health production legacy redirect verification
on:
  pull_request:
    paths:
      - '.github/workflows/health-live-redirect-verify.yml'
      - 'scripts/health-release-verify.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-live-legacy-redirects:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm all 46 source redirect rules
        run: node scripts/health-release-verify.mjs --source
      - name: Check all 46 live redirects and their first-party HTML destinations
        run: node scripts/health-release-verify.mjs --live
      - name: Verify live Worker runtime, public APIs, and all 143 tool pages
        env:
          YH_HOST: yorphives.com
          EXPECT_RUNTIME: workers
        run: node scripts/live-cutover-check.mjs
      - name: Install isolated open-source Chromium browser runner
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run representative production browser-local tool and mobile checks
        run: node scripts/health-browser-smoke.mjs
      - name: Record verification boundary
        if: always()
        run: |
          echo 'Public read-only GET checks. No secrets, visitor analytics writes, website mutations, HQ changes or production deployments. Destination HTML does not prove interactive tool functionality.' >> "$GITHUB_STEP_SUMMARY"
