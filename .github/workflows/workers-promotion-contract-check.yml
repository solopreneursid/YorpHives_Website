name: YorpHives Workers promotion workflow contract check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/workers-production-promotion.yml'
      - '.github/workflows/workers-promotion-contract-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate protected Workers release workflow without deployment
        shell: bash
        run: |
          set -euo pipefail
          ruby - <<'RUBY'
          require 'yaml'
          p=YAML.load_file('.github/workflows/workers-production-promotion.yml')
          triggers=p['on'] || p[true]
          raise 'missing manual dispatch' unless triggers.is_a?(Hash) && triggers.key?('workflow_dispatch')
          raise 'automatic trigger forbidden' unless triggers.keys==['workflow_dispatch']
          job=p.dig('jobs','production')
          raise 'missing protected environment' unless job['environment']=='yorphives-production'
          raw=File.read('.github/workflows/workers-production-promotion.yml')
          required=[
            'actions/download-artifact@v6',
            'scripts/release-verify-local.mjs',
            'scripts/release-verify.mjs',
            'scripts/release-live-pages.mjs',
            'edge/live/wrangler.jsonc',
            'yorphives-edge-static-live',
            'PREVIOUS_WORKER_VERSION',
            'rollback-response.json',
            "PUBLISH_YORPHIVES_NOW",
            'workers/scripts/$WORKER_NAME/deployments',
            'INSIGHTS_DB',
            'HQCONNECT_DB'
          ]
          missing=required.reject{|s| raw.include?(s)}
          raise "missing release controls: #{missing.join(',')}" unless missing.empty?
          job['steps'].each_with_index do |step,i|
            next unless step['run']
            file="/tmp/yorphives-prod-step-#{i}.sh"
            File.write(file,step['run'])
            raise "Invalid bash syntax in step #{i}: #{step['name']}" unless system('bash','-n',file)
          end
          puts 'WORKERS_RELEASE_WORKFLOW_CONTRACT_PASS'
          RUBY
      - name: Regression-test pasted tabs and reject invalid consent without deployment
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -e 'w=YAML.load_file(".github/workflows/workers-production-promotion.yml");s=w["jobs"]["production"]["steps"].find{|s| s["name"]=="Verify founder consent, secret and immutable candidate identity"};abort "missing approval gate" unless s;File.write("/tmp/yorphives-founder-input-gate.sh",s["run"])'
          export SOURCE_SHA='f98207dc98a3b109d0f2bb27b524ad3ab809d0e4'
          export FINGERPRINT=$'\tee121b41b3ab814870e1829cd27b5d2db75d48689704aa2057daa85543ec96b4'
          export READINESS_RUN_ID='45201553389'
          export APPROVAL_PHRASE=$'\tPUBLISH_YORPHIVES_NOW'
          export CLOUDFLARE_API_TOKEN='mock-not-a-real-token'
          export GITHUB_ENV
          GITHUB_ENV="$(mktemp)"
          bash /tmp/yorphives-founder-input-gate.sh
          grep -Fx 'FINGERPRINT=ee121b41b3ab814870e1829cd27b5d2db75d48689704aa2057daa85543ec96b4' "$GITHUB_ENV"
          grep -Fx 'APPROVAL_PHRASE=PUBLISH_YORPHIVES_NOW' "$GITHUB_ENV"
          if FINGERPRINT='ee121b41b3ab814870e1829cd27b5d2db75d48689704aa2057daa85543ec96b4 invalid' bash /tmp/yorphives-founder-input-gate.sh; then
            echo 'FAIL: embedded/extra fingerprint text was accepted'; exit 1
          fi
          if APPROVAL_PHRASE='NOT_APPROVED' bash /tmp/yorphives-founder-input-gate.sh; then
            echo 'FAIL: incorrect approval phrase was accepted'; exit 1
          fi
          if SOURCE_SHA='0000000000000000000000000000000000000000' bash /tmp/yorphives-founder-input-gate.sh; then
            echo 'FAIL: incorrect source commit was accepted'; exit 1
          fi
          echo 'FOUNDER_INPUT_WHITESPACE_REGRESSION_PASS'
