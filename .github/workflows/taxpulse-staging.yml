name: TaxPulse staging checks
on:
  push:
    branches: [hqventures/taxpulse-global]
    paths:
      - 'products/taxpulse-global/**'
      - '.github/workflows/taxpulse-staging.yml'
  pull_request:
    paths:
      - 'products/taxpulse-global/**'
      - '.github/workflows/taxpulse-staging.yml'
permissions:
  contents: read
jobs:
  staging-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test products/taxpulse-global/tests/staging.test.mjs
