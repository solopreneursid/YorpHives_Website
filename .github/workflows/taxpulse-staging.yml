name: TaxPulse staging checks
on:
  push:
    branches: [hqventures/taxpulse-global]
    paths:
      - 'products/taxpulse-global/**'
      - '.github/workflows/taxpulse-staging.yml'
  pull_request:
    paths:
      - 'products/taxpulse-global/**'
      - '.github/workflows/taxpulse-staging.yml'
permissions:
  contents: read
jobs:
  staging-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test products/taxpulse-global/tests/*.test.mjs
      - name: Install pinned browser test dependency
        if: github.event_name == 'push'
        working-directory: products/taxpulse-global
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.65.1
      - name: Install Chromium
        if: github.event_name == 'push'
        working-directory: products/taxpulse-global
        run: npx --no-install playwright install --with-deps chromium
      - name: Test the actual simple workspace in Chromium
        if: github.event_name == 'push'
        run: node products/taxpulse-global/browser-tests/smoke.mjs
