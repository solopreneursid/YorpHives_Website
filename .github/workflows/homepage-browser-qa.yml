name: Homepage cross-browser viewport QA
on:
  pull_request:
    paths:
      - 'reimagined/**'
      - 'scripts/homepage-browser-qa.mjs'
      - '.github/workflows/homepage-browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned project dependencies
        run: npm ci --ignore-scripts
      - name: Install open-source browser test dependency
        run: npm install --no-save --ignore-scripts playwright@1.65.1
      - name: Install Chromium Firefox and WebKit runtimes
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build isolated static preview
        run: node scripts/build-site.mjs --target=preview
      - name: Exercise responsive layouts in 3 browser engines
        run: node scripts/homepage-browser-qa.mjs
      - name: Retain screenshots for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-browser-screenshots
          path: qa-*.png
          if-no-files-found: ignore
          retention-days: 3
