name: GovRadar portable source collector
# Cron runs only on the repository's default branch after a reviewed release.
# PRs always execute a read-only dry-run. This workflow never uses India data.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Submit signed official-source results to isolated GovRadar staging"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '55 */3 * * *'
  push:
    branches:
      - feat/govradar-phase1-sources-20261116
    paths:
      - '.github/workflows/govradar-portable-collector.yml'
  pull_request:
    paths:
      - 'apps/govexam-radar/**'
      - '.github/workflows/govradar-portable-collector.yml'
permissions:
  contents: read
concurrency:
  group: govradar-source-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline parser, security and HTTP bridge tests
        run: node --test apps/govexam-radar/collector-bridge.test.mjs apps/govexam-radar/collector-client.test.mjs
      - name: Read official sources without publishing (always safe)
        env:
          GOVRADAR_COLLECTOR_TARGET: https://hqventures-govexam-parity-preview.solopreneursid-proy.workers.dev
        run: node apps/govexam-radar/collector-client.mjs --dry-run
      # One-shot trusted-branch staging proof, removed immediately after completion.
      - name: One-time signed atomic audit verification
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/feat/govradar-phase1-sources-20261116' &&
          github.event.head_commit.message == 'test(govradar): one-time atomic claim signed staging'
        env:
          GOVRADAR_COLLECTOR_KEY: ${{ secrets.GOVRADAR_COLLECTOR_KEY }}
          GOVRADAR_COLLECTOR_TARGET: https://hqventures-govexam-parity-preview.solopreneursid-proy.workers.dev
        run: |
          if [ -z "${GOVRADAR_COLLECTOR_KEY}" ]; then
            echo "Protected repository collector secret is unavailable."
            exit 1
          fi
          node --input-type=module -e 'import {collectOnce} from "./apps/govexam-radar/collector-client.mjs";const out=await collectOnce({target:process.env.GOVRADAR_COLLECTOR_TARGET,source:"manitoba",key:process.env.GOVRADAR_COLLECTOR_KEY,dryRun:false,now:Date.now()+10800000});if(out[0]?.state!=="published")process.exit(1);console.log(JSON.stringify({test:"signed_audit_commit",status:out[0].state,accepted:out[0].accepted}));'
      - name: Signed publish — only scheduled or founder manual approval
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
        env:
          GOVRADAR_COLLECTOR_KEY: ${{ secrets.GOVRADAR_COLLECTOR_KEY }}
          GOVRADAR_COLLECTOR_TARGET: https://hqventures-govexam-parity-preview.solopreneursid-proy.workers.dev
        run: |
          if [ -z "${GOVRADAR_COLLECTOR_KEY}" ]; then
            echo "Collector disabled: protected GOVRADAR_COLLECTOR_KEY is not installed."
            exit 1
          fi
          node apps/govexam-radar/collector-client.mjs
