name: Health - real-browser smoke
on:
  pull_request:
    paths:
      - 'scripts/health-browser-smoke.mjs'
      - '.github/workflows/health-browser-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-local-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned open-source browser runner
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify real browser-local tools and mobile layout without analytics writes
        run: node scripts/health-browser-smoke.mjs
      - name: Verification boundary
        if: always()
        run: |
          echo 'Representative Chromium browser-local tool tests; not exhaustive functional coverage of all 143 tools or authenticated HQ.' >> "$GITHUB_STEP_SUMMARY"
