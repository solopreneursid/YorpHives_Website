name: YorpHives one-time verified website repair release
on:
  push:
    branches: ['codex/verified-site-release-20261124']
    paths: ['.github/workflows/one-time-site-repair-release.yml']
permissions:
  contents: read
  actions: read
  deployments: write
concurrency:
  group: yorphives-production-promotion
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    environment: yorphives-production
    timeout-minutes: 30
    env:
      SOURCE_SHA: '4800e2e56e89a4080600e2d74ecb70dda1810310'
      FINGERPRINT: '112cde8382a413b97052f6336ddc6ceaaa47720748a8ee3fff819c93c84fef64'
      QA_RUN_ID: '45317496299'
      PREVIOUS_SOURCE_SHA: 'f98207dc98a3b109d0f2bb27b524ad3ab809d0e4'
      PREVIOUS_FINGERPRINT: 'ee121b41b3ab814870e1829cd27b5d2db75d48689704aa2057daa85543ec96b4'
      EXPECTED_WORKER_VERSION: '33b7bc49-1626-427b-bf4e-4946bafa7497'
      CLOUDFLARE_ACCOUNT_ID: '69234e51e08d8013980a7ff869746609'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_NAME: yorphives-edge-static-live
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Require the passing quality audit for this exact source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$QA_RUN_ID" > /tmp/site-audit-provenance.json
          node - <<'NODE'
          const r=require('/tmp/site-audit-provenance.json');
          if(r.status!=='completed'||r.conclusion!=='success'||r.head_sha!==process.env.SOURCE_SHA||r.head_branch!=='codex/live-quality-audit-20261124'||!r.path?.includes('.github/workflows/website-quality-audit.yml'))
            throw Error('The exact website candidate has not passed its complete quality audit.');
          NODE
      - uses: actions/checkout@v6
        with:
          ref: '4800e2e56e89a4080600e2d74ecb70dda1810310'
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build and verify the pinned production candidate
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ]
          npm ci --ignore-scripts --no-fund --no-audit
          npm audit --omit=dev --audit-level=high
          npm install --no-save --package-lock=false --ignore-scripts --no-fund --no-audit wrangler@4.68.0
          YORPHIVES_SOURCE_SHA="$SOURCE_SHA" node scripts/build-site.mjs --target=production
          node scripts/release-check.mjs dist
          node scripts/release-verify-local.mjs dist "$SOURCE_SHA" "$FINGERPRINT" production
          node --test tests/release-verify.test.mjs tests/live-quality-repairs.test.mjs
          npx wrangler deploy --config edge/live/wrangler.jsonc --dry-run --outdir /tmp/yorphives-worker-dry-run
      - name: Require the known current release and preserve its rollback version
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          node scripts/release-verify.mjs https://yorphives.com "$PREVIOUS_SOURCE_SHA" "$PREVIOUS_FINGERPRINT" production
          for suffix in settings deployments; do
            curl --fail --silent --show-error --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/$suffix" > "/tmp/worker-$suffix.json"
          done
          node - <<'NODE'
          const fs=require('fs'),s=require('/tmp/worker-settings.json'),d=require('/tmp/worker-deployments.json');
          const names=new Set((s.result?.bindings||[]).map(x=>x.name));
          for(const n of ['ASSETS','INSIGHTS_DB','HQCONNECT_DB','AGENT_USAGE','AGENT_CLIENT_LIMIT','AGENT_GLOBAL_LIMIT','CONTACT_CLIENT_LIMIT','CONTACT_GLOBAL_LIMIT'])
            if(!names.has(n))throw Error('Required production binding missing: '+n);
          const live=Object.fromEntries(s.result.bindings.map(x=>[x.name,x]));
          const config=JSON.parse(fs.readFileSync('edge/live/wrangler.jsonc','utf8'));
          if(config.name!==process.env.WORKER_NAME||config.assets?.binding!=='ASSETS'||config.workers_dev!==false)
            throw Error('Unexpected production Worker configuration.');
          for(const item of config.d1_databases||[])
            if(live[item.binding]?.type!=='d1'||live[item.binding]?.database_id!==item.database_id)
              throw Error('Production database binding differs: '+item.binding);
          for(const item of config.ratelimits||[]){
            const current=live[item.name];
            if(current?.type!=='ratelimit'||current.namespace_id!==item.namespace_id||current.simple?.limit!==item.simple.limit||current.simple?.period!==item.simple.period)
              throw Error('Production rate limit differs: '+item.name);
          }
          if(live.AGENT_USAGE?.dataset!=='yorphives_agent_usage_v1')throw Error('Production analytics dataset differs.');
          const v=d.result?.deployments?.[0]?.versions;
          if(!s.success||!d.success||v?.length!==1||v[0].percentage!==100||v[0].version_id!==process.env.EXPECTED_WORKER_VERSION)
            throw Error('Production changed or has no exact known-good rollback version.');
          fs.appendFileSync(process.env.GITHUB_ENV,'PREVIOUS_WORKER_VERSION='+v[0].version_id+'\n');
          NODE
      - name: Publish the exact candidate to the existing Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/deployments" > /tmp/worker-before-deploy.json
          node -e "const v=require('/tmp/worker-before-deploy.json').result?.deployments?.[0]?.versions;if(v?.length!==1||v[0].version_id!==process.env.PREVIOUS_WORKER_VERSION||v[0].percentage!==100)throw Error('Production changed during preflight')"
          npx wrangler deploy --config edge/live/wrangler.jsonc
      - name: Verify the real website and all public tool routes
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if node scripts/release-verify.mjs https://yorphives.com "$SOURCE_SHA" "$FINGERPRINT" production && \
              YORPHIVES_LIVE_ROUTE_RESULTS=live-route-results.json node scripts/release-live-pages.mjs https://yorphives.com && \
              node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const get=path=>fetch('https://yorphives.com'+path,{headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(20000)});
          const recorder=await get('/tools/voice-recorder/');
          assert.equal(recorder.status,200);
          const permissions=recorder.headers.get('permissions-policy')||'';
          assert.match(permissions,/microphone=\(self\)/);
          assert.doesNotMatch(permissions,/microphone=\(\)/);
          const home=await get('/');
          assert.equal(home.status,200);
          const html=await home.text();
          assert.ok(html.includes('insights-client.mjs'));
          assert.ok(!html.includes('static.cloudflareinsights.com/beacon'));
          const health=await get('/api/monitoring/health');
          assert.equal(health.status,200);
          assert.equal((await health.json()).ok,true);
          console.log('LIVE_REPAIR_AND_HEALTH_CHECKS_PASSED');
          NODE
            then
              echo 'Verified website repair is live.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo 'Live verification failed; restore the previous Worker version.' >&2
          exit 1
      - name: Restore the known-good Worker if publication or verification failed
        if: ${{ failure() && steps.snapshot.outcome == 'success' && (steps.deploy.outcome == 'failure' || steps.verify.outcome == 'failure') }}
        shell: bash
        run: |
          set -euo pipefail
          node -e "require('fs').writeFileSync('/tmp/rollback.json',JSON.stringify({strategy:'percentage',versions:[{version_id:process.env.PREVIOUS_WORKER_VERSION,percentage:100}],annotations:{'workers/message':'Automatic rollback after failed verified website repair'}}))"
          curl --fail --silent --show-error --max-time 60 -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/rollback.json "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/deployments" > /tmp/rollback-response.json
          node -e "if(!require('/tmp/rollback-response.json').success)throw Error('Rollback API did not report success')"
          restored=0
          for attempt in 1 2 3 4 5 6; do
            curl --fail --silent --show-error --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/deployments" > /tmp/rollback-state.json
            if node -e "const v=require('/tmp/rollback-state.json').result?.deployments?.[0]?.versions;if(v?.length!==1||v[0].version_id!==process.env.PREVIOUS_WORKER_VERSION||v[0].percentage!==100)process.exit(1)"; then restored=1; break; fi
            sleep 5
          done
          [ "$restored" -eq 1 ] || { echo 'CRITICAL: rollback not confirmed'; exit 1; }
          echo 'Previous Worker version restored.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Preserve post-release route evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: yorphives-repair-release-verification
          path: live-route-results.json
          retention-days: 14
          if-no-files-found: warn
