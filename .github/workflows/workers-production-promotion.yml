name: YorpHives founder-approved Workers production release
on:
  workflow_dispatch:
    inputs:
      readiness_run_id:
        description: 'Successful immutable candidate workflow run'
        required: true
        type: string
        default: '45413794425'
      source_sha:
        description: 'Exact candidate source commit (40 lowercase hex characters)'
        required: true
        type: string
        default: '08c982fc025e3836992b9c2b7cde63b3db16927f'
      asset_fingerprint:
        description: 'Approved release fingerprint (64 lowercase hex characters)'
        required: true
        type: string
        default: 'c50f9a82fbff79d8130238af50594ff7ae738d6d16dc367b68616aed5977431b'
      approval_phrase:
        description: 'Explicitly type PUBLISH_YORPHIVES_NOW'
        required: true
        type: string
permissions:
  contents: read
  actions: read
  deployments: write
concurrency:
  group: yorphives-production-promotion
  cancel-in-progress: false
jobs:
  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: yorphives-production
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      FINGERPRINT: ${{ inputs.asset_fingerprint }}
      READINESS_RUN_ID: ${{ inputs.readiness_run_id }}
      APPROVAL_PHRASE: ${{ inputs.approval_phrase }}
      CLOUDFLARE_ACCOUNT_ID: '69234e51e08d8013980a7ff869746609'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_NAME: yorphives-edge-static-live
    steps:
      - name: Verify founder consent, secret and immutable candidate identity
        shell: bash
        run: |
          set -euo pipefail
          # GitHub's manual input form can preserve a pasted leading tab.
          # Remove surrounding whitespace only; embedded whitespace is never accepted.
          for key in SOURCE_SHA FINGERPRINT READINESS_RUN_ID APPROVAL_PHRASE; do
            value="${!key}"
            value="$(printf '%s' "$value" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
            printf -v "$key" '%s' "$value"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'Invalid source commit SHA'; exit 1; }
          [[ "$FINGERPRINT" =~ ^[a-f0-9]{64}$ ]] || { echo 'Invalid release fingerprint'; exit 1; }
          [[ "$READINESS_RUN_ID" =~ ^[0-9]{5,16}$ ]] || { echo 'Invalid readiness run ID'; exit 1; }
          [ "$APPROVAL_PHRASE" = 'PUBLISH_YORPHIVES_NOW' ] || { echo 'Founder approval phrase invalid'; exit 1; }
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo 'Cloudflare Workers write token unavailable'; exit 1; }
          [ "$SOURCE_SHA" = '08c982fc025e3836992b9c2b7cde63b3db16927f' ] || { echo 'Source does not match currently approved release'; exit 1; }
          [ "$FINGERPRINT" = 'c50f9a82fbff79d8130238af50594ff7ae738d6d16dc367b68616aed5977431b' ] || { echo 'Artifact fingerprint not approved'; exit 1; }
          [ "$READINESS_RUN_ID" = '45413794425' ] || { echo 'Unreviewed candidate run'; exit 1; }
      - name: Verify official passing readiness run and protected founder reviewer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/environments/yorphives-production" > env-protection.json
          node - <<'NODE'
          const e=require('./env-protection.json');
          const ok=(e.protection_rules||[]).some(r=>r.type==='required_reviewers'&&(r.reviewers||[]).some(x=>x.type==='User'&&x.reviewer?.login==='solopreneursid'));
          if(!ok)throw Error('Required founder review is not configured');
          NODE
          gh api "repos/$GH_REPO/actions/runs/$READINESS_RUN_ID" > readiness-provenance.json
          node - <<'NODE'
          const r=require('./readiness-provenance.json');
          if(r.status!=='completed'||r.conclusion!=='success'||r.head_branch!=='main'||!r.path?.includes('.github/workflows/release-readiness.yml'))
            throw Error('Artifact must originate from a green official release-readiness workflow');
          NODE
      - uses: actions/checkout@v6
        with:
          ref: release/yorphives-reimagined-20261116
          fetch-depth: 0
          path: source
          persist-credentials: false
      - name: Verify approved source is on official release branch
        shell: bash
        run: |
          set -euo pipefail
          cd source
          git fetch origin release/yorphives-reimagined-20261116
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/release/yorphives-reimagined-20261116
          git checkout --detach "$SOURCE_SHA"
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/download-artifact@v6
        with:
          name: yorphives-production-candidate
          run-id: ${{ inputs.readiness_run_id }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify immutable release package and Worker runtime bindings
        shell: bash
        run: |
          set -euo pipefail
          test -s candidate/yorphives-production-candidate.tar.gz
          test -s candidate/candidate-manifest.json
          mkdir -p source/dist
          tar --no-same-owner --no-same-permissions -xzf candidate/yorphives-production-candidate.tar.gz -C source/dist
          node source/scripts/release-verify-local.mjs source/dist "$SOURCE_SHA" "$FINGERPRINT" production
          cmp candidate/candidate-manifest.json source/dist/.well-known/yorphives-release.json
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('source/edge/live/wrangler.jsonc'));
          const db=Object.fromEntries((c.d1_databases||[]).map(v=>[v.binding,v.database_id]));
          const limits=(c.ratelimits||[]).map(v=>v.name);
          if(c.name!=='yorphives-edge-static-live'||c.assets?.directory!=='../../dist'||c.assets?.binding!=='ASSETS'||c.workers_dev!==false)throw Error('Wrong Worker runtime');
          if(db.INSIGHTS_DB!=='e7e3e27c-8cfb-44e1-bcd5-6c3a186ceaa7'||db.HQCONNECT_DB!=='4104b276-dff6-460b-94a4-d331dd4b1799')throw Error('Production database binding mismatch');
          if(['AGENT_CLIENT_LIMIT','AGENT_GLOBAL_LIMIT','CONTACT_CLIENT_LIMIT','CONTACT_GLOBAL_LIMIT'].some(v=>!limits.includes(v)))throw Error('Rate limit binding missing');
          if((c.analytics_engine_datasets||[]).find(x=>x.binding==='AGENT_USAGE')?.dataset!=='yorphives_agent_usage_v1')throw Error('Analytics binding mismatch');
          NODE
      - name: Require token access to the actual live Worker before any upload
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/settings" > current-worker-settings.json
          node - <<'NODE'
          const s=require('./current-worker-settings.json');
          if(!s.success)throw Error('Token cannot read current production Worker settings');
          const names=new Set((s.result?.bindings||[]).map(x=>x.name));
          for(const n of ['ASSETS','INSIGHTS_DB','HQCONNECT_DB','AGENT_USAGE','AGENT_CLIENT_LIMIT','AGENT_GLOBAL_LIMIT','CONTACT_CLIENT_LIMIT','CONTACT_GLOBAL_LIMIT'])
            if(!names.has(n))throw Error('Existing production binding is missing: '+n);
          NODE
      - name: Snapshot active Worker version for automatic rollback
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/deployments" > previous-worker-deployments.json
          node - <<'NODE'
          const fs=require('fs');
          const d=require('./previous-worker-deployments.json');
          const first=d.result?.deployments?.[0];
          if(!d.success||first?.versions?.length!==1||first.versions[0].percentage!==100||!/^[a-f0-9-]{36}$/i.test(first.versions[0].version_id||''))throw Error('No exact known-good Worker rollback version');
          fs.appendFileSync(process.env.GITHUB_ENV,'PREVIOUS_WORKER_VERSION='+first.versions[0].version_id+'\n');
          console.log('KNOWN_GOOD_WORKER_VERSION',first.versions[0].version_id);
          NODE
      - name: Deploy identical tested assets to the actual live Workers runtime
        id: deploy
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.68.0 deploy --config edge/live/wrangler.jsonc
      - name: Verify real apex domain, released assets, 143 published tool routes and APIs
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if node source/scripts/release-verify.mjs https://yorphives.com "$SOURCE_SHA" "$FINGERPRINT" production && \
              YORPHIVES_LIVE_ROUTE_RESULTS=live-route-results.json node source/scripts/release-live-pages.mjs https://yorphives.com && \
              curl --fail --silent --show-error --max-time 20 https://yorphives.com/api/monitoring/health > health.json && \
              node -e "const h=require('./health.json');if(h?.ok!==true)process.exit(1)"; then
              echo 'ACTUAL_WORKER_PRODUCTION_VERIFIED' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo 'Live Worker failed exact release checks; trigger rollback' >&2
          exit 1
      - name: Restore last-known-good Worker version on any post-snapshot failure
        if: ${{ failure() && steps.snapshot.outcome == 'success' && (steps.deploy.outcome == 'failure' || steps.verify.outcome == 'failure') }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          fs.writeFileSync('rollback-body.json',JSON.stringify({strategy:'percentage',versions:[{version_id:process.env.PREVIOUS_WORKER_VERSION,percentage:100}],annotations:{'workers/message':'Automatic rollback after failed verified production release'}}));
          NODE
          curl --fail --silent --show-error --max-time 60 -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @rollback-body.json \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/deployments" > rollback-response.json
          node -e "const r=require('./rollback-response.json');if(!r.success)process.exit(1)"
          verified=0
          for attempt in 1 2 3 4 5 6; do
            curl --fail --silent --show-error --max-time 20 \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/deployments" > rollback-state.json
            if node - <<'NODE'
          const d=require('./rollback-state.json');
          const v=d.result?.deployments?.[0]?.versions;
          if(!d.success||v?.length!==1||v[0].version_id!==process.env.PREVIOUS_WORKER_VERSION||v[0].percentage!==100)process.exit(1);
          NODE
            then verified=1; break; fi
            sleep 5
          done
          [ "$verified" -eq 1 ] || { echo 'CRITICAL: Worker rollback not confirmed by deployment API'; exit 1; }
          curl --fail --silent --show-error --max-time 20 https://yorphives.com/api/agent/v1/capabilities > /dev/null
          echo "Previous Worker version restored and deployment state verified: $PREVIOUS_WORKER_VERSION" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Retain post-release route evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: yorphives-actual-workers-live-verification
          path: |
            live-route-results.json
            health.json
          if-no-files-found: warn
          retention-days: 30
