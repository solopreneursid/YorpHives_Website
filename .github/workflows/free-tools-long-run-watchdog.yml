name: YorpHives Free Tools long-run watchdog
on:
  push:
    branches: [main]
    paths:
      - 'ops/adsense-watchdog.mjs'
      - 'ops/free-tools-seo-audit.mjs'
      - '.github/workflows/free-tools-long-run-watchdog.yml'
  schedule:
    # Extra windows reduce the time lost when a scheduled GitHub run is dropped.
    - cron: '17 3,9,15,21 * * *'
  # A source release is verified independently; this workflow checks the live site.
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: yorphives-free-tools-watchdog
  cancel-in-progress: false
jobs:
  verify-free-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check production site, all tools daily, privacy and ad safety
        id: audit
        continue-on-error: true
        env:
          YH_FULL_AUDIT: 'true'
        run: node ops/adsense-watchdog.mjs | tee yorphives-watchdog.log; exit ${PIPESTATUS[0]}
      - name: Audit SEO metadata, canonicals, content and sitemap
        id: seo
        continue-on-error: true
        run: node ops/free-tools-seo-audit.mjs
      - name: Upload SEO review findings
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: yorphives-free-tools-seo-audit
          path: |
            yorphives-seo-report.json
            yorphives-seo-report.md
          retention-days: 14
          if-no-files-found: warn
      - name: Maintain one SEO improvement review issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ ! -f yorphives-seo-report.json ]; then
            echo "SEO evidence absent; do not replace an existing review issue."
            exit 0
          fi
          warnings=$(jq -r '.counts.warnings // 0' yorphives-seo-report.json)
          existing=$(gh issue list --state open --search 'YorpHives Free Tools SEO review in:title' --json number --jq '.[0].number // empty' || true)
          if [ "$warnings" -gt 0 ]; then
            {
              echo "# Free Tools SEO improvements"
              echo
              echo "Advisory review only. Findings are not verified Search Console issues or revenue measurements."
              echo
              echo "Warnings: $warnings. Read the complete SEO audit artifact attached to this workflow run:"
              echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              echo
              jq -r '.warnings[:14][] | "- **" + .kind + "**: " + .path + " — " + .detail' yorphives-seo-report.json
              echo
              echo "Next action: Review real traffic data and founder-approved fixes. No automatic editing or deployment."
            } > seo-issue-body.md
            if [ -z "$existing" ]; then
              gh issue create --title "YorpHives Free Tools SEO review" --body-file seo-issue-body.md
            else
              gh issue edit "$existing" --body-file seo-issue-body.md
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Latest automated SEO audit returned no advisory warnings."
          fi
      - name: Upload inspection evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: yorphives-free-tools-watchdog
          path: yorphives-watchdog.log
          retention-days: 14
          if-no-files-found: ignore
      - name: Record or resolve issue on monitoring outcome
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OUTCOME: ${{ steps.audit.outcome }}
          SEO_OUTCOME: ${{ steps.seo.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          existing=$(gh issue list --state open --search 'YorpHives Free Tools watchdog failure in:title' --json number --jq '.[0].number // empty' || true)
          if [ "$OUTCOME" != "success" ] || [ "$SEO_OUTCOME" != "success" ]; then
            if [ -z "$existing" ]; then
              gh issue create --title "YorpHives Free Tools watchdog failure" --body "@solopreneursid — Critical Free Tools monitoring alert. Automated public-site health check failed. See the newest **YorpHives Free Tools long-run watchdog** Actions run and its attached audit artifacts. Checks are read-only: no production files, ad settings, or customer data were modified."
            else
              echo "Existing incident issue #$existing; no duplicate issue."
            fi
            exit 1
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Automated production checks recovered. The latest watchdog run passed."
          fi
