name: Health - resolved npm dependency audit
on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/health-dependency-audit.yml'
      - 'scripts/health-dependency-audit.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolved-npm-security:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact locked dependency graph without lifecycle scripts
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Query npm advisory database without modifying production artifacts
        shell: bash
        run: |
          set +e
          npm audit --json > dependency-audit-report.json
          audit_exit=$?
          set -e
          echo "npm audit command exit status: $audit_exit"
          node scripts/health-dependency-audit.mjs
      - name: Verify production build against committed npm lock
        run: |
          node scripts/build-site.mjs --target=production
          node scripts/release-check.mjs dist
          node --test tests/*.test.mjs
      - name: Read-only live checks of all 143 published tool pages and agent APIs
        env:
          YH_HOST: yorphives.com
          EXPECT_RUNTIME: workers
        run: node scripts/live-cutover-check.mjs
      - name: Record scope and limitations
        if: always()
        run: |
          {
            echo '## Health dependency audit'
            echo 'Installs an exact committed npm package-lock graph in a disposable CI runner.'
            echo 'Audits transitive npm dependencies for high/critical findings.'
            echo 'This is a source-locked npm audit; deployed vendored scripts still require independent verification.'
            echo 'No production writes, secrets, uploads, or automatic fixes.'
          } >> "$GITHUB_STEP_SUMMARY"
