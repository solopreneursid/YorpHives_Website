name: YorpHives independent live Workers verification (read-only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-live-workers-activation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: f98207dc98a3b109d0f2bb27b524ad3ab809d0e4
      FINGERPRINT: ee121b41b3ab814870e1829cd27b5d2db75d48689704aa2057daa85543ec96b4
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '69234e51e08d8013980a7ff869746609'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: f98207dc98a3b109d0f2bb27b524ad3ab809d0e4
          path: source
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: main
          path: control
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify exact bytes of live site assets and release manifest
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            if node control/scripts/release-verify-worker-live.mjs https://yorphives.com "$SOURCE_SHA" "$FINGERPRINT" production; then
              echo 'APPROVED_LIVE_RELEASE_FINGERPRINT_PASS' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 8
          done
          echo 'CRITICAL LIVE RELEASE IDENTITY MISMATCH'
          exit 1
      - name: Verify every published tool route and landing page
        shell: bash
        run: |
          set -euo pipefail
          YORPHIVES_LIVE_ROUTE_RESULTS=live-route-results.json node source/scripts/release-live-pages.mjs https://yorphives.com
      - name: Verify live Worker APIs, SEO and AdSense routes
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const paths=[
            ['/api/monitoring/health','json'],
            ['/api/agent/v1/capabilities','json'],
            ['/api/insights/public','json'],
            ['/api/insights/growth','json'],
            ['/ads.txt','text'],
            ['/robots.txt','text'],
            ['/llms.txt','text'],
            ['/sitemap.xml','text'],
            ['/.well-known/agentic.json','json']
          ];
          for(const [path,kind] of paths){
            const r=await fetch('https://yorphives.com'+path,{headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(16000)});
            if(r.status!==200)throw Error('Public route failed: '+path+' HTTP '+r.status);
            if(kind==='json'){
              const value=await r.json();
              if(path==='/api/monitoring/health'&&value?.ok!==true)throw Error('Monitoring health is not healthy');
            }else{
              const body=await r.text();
              if(!body||body.length<15)throw Error('Empty critical static response: '+path);
              if(path==='/robots.txt'&&/disallow:\s*\//i.test(body))throw Error('Production robots disallowed');
            }
            if(path.startsWith('/api/')&&r.headers.get('x-yorphives-edge-runtime')!=='workers-static')
              throw Error('API is not served by expected Worker: '+path);
            console.log('PUBLIC_ROUTE_PASS',path,r.status);
          }
          const w=await fetch('https://www.yorphives.com/ads.txt',{redirect:'manual',signal:AbortSignal.timeout(16000)});
          if(w.status!==301||w.headers.get('location')!=='https://yorphives.com/ads.txt')
            throw Error('www canonical redirect differs from expected');
          console.log('AD_CANONICAL_REDIRECT_PASS');
          NODE
      - name: Verify current Cloudflare Worker deployment still uses staged release version
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 25 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/yorphives-edge-static-live/deployments" > /tmp/workers-deployment.json
          node - <<'NODE'
          const d=require('/tmp/workers-deployment.json');
          const v=d.result?.deployments?.[0]?.versions;
          if(!d.success||v?.length!==1||v[0].version_id!=='33b7bc49-1626-427b-bf4e-4946bafa7497'||v[0].percentage!==100)
            throw Error('Incorrect production Worker version');
          console.log('CLOUDFLARE_WORKER_DEPLOYMENT_VERIFIED');
          NODE
      - name: Retain public-only verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: yorphives-workers-independent-postdeploy-verification
          path: live-route-results.json
          if-no-files-found: warn
          retention-days: 30
