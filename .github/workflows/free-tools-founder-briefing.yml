name: YorpHives Free Tools independent supervisor and weekly briefing
on:
  schedule:
    - cron: '13,43 * * * *'
    - cron: '41 4 * * 1'
  push:
    branches: [main]
    paths:
      - 'ops/free-tools-founder-briefing.mjs'
      - 'ops/monitor-health.mjs'
      - 'ops/monitor-health.test.mjs'
      - '.github/workflows/free-tools-founder-briefing.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  issues: write
concurrency:
  group: yorphives-free-tools-founder-briefing
  cancel-in-progress: false
jobs:
  supervise:
    if: github.event_name != 'schedule' || github.event.schedule == '13,43 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Test monitoring decision rules with synthetic evidence
        run: node --test ops/monitor-health.test.mjs
      - name: Check website monitoring and the generic enquiry-service heartbeat
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ops/free-tools-founder-briefing.mjs --supervise
  weekly-briefing:
    if: github.event_name != 'schedule' || github.event.schedule == '41 4 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Refresh one founder briefing issue from verified public evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ops/free-tools-founder-briefing.mjs --weekly
