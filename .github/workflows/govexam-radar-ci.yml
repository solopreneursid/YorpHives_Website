name: GovRadar checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/govexam-radar/**'
      - '.github/workflows/govexam-radar-ci.yml'
  pull_request:
    paths:
      - 'apps/govexam-radar/**'
      - '.github/workflows/govexam-radar-ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/govexam-radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit and API tests
        run: node --test worker.test.mjs source-monitor.test.mjs official-feed.test.mjs manitoba-feed.test.mjs india-employment-news.test.mjs moderation.test.mjs collector-bridge.test.mjs collector-client.test.mjs deploy-guard.test.mjs ingestion-status.test.mjs schedule.test.mjs source-rights.test.mjs
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser tests at phone, tablet, and desktop widths
        run: node --test browser.test.mjs
      - name: Save test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: govradar-responsive-previews
          path: apps/govexam-radar/govradar-*.png
          if-no-files-found: ignore
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check independent Cloudflare deployment
        run: |
          curl --fail --show-error --silent --max-time 25 --retry 2 https://hqventures-govexam-radar.solopreneursid-proy.workers.dev/api/health | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{const d=JSON.parse(s);if(d.status!=="ok"||d.service!=="hqventures-govradar")process.exit(1);console.log("Cloudflare health verified",d.version);})'
          curl --fail --show-error --silent --max-time 25 https://hqventures-govexam-parity-preview.solopreneursid-proy.workers.dev/api/health | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{const d=JSON.parse(s);if(d.status!=="ok"||d.version!=="2.5.0")process.exit(1);console.log("Full-parity preview health verified",d.version);})'
          curl --fail --show-error --silent --max-time 25 https://hqventures-govexam-parity-preview.solopreneursid-proy.workers.dev/api/source-status | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{const d=JSON.parse(s);if(d.total!==58||!Array.isArray(d.sources)||d.verifiedVacancies!==0)process.exit(1);console.log("Scheduled status catalog verified",d.total);})'
          curl --fail --show-error --silent --max-time 25 --retry 1 "https://hqventures-govexam-parity-preview.solopreneursid-proy.workers.dev/api/check?id=upsc" | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{const d=JSON.parse(s);if(d.sourceId!=="upsc"||!["reachable","restricted","unconfirmed"].includes(d.status))process.exit(1);console.log("Real on-demand source check:",d.status);})'
          curl --fail --show-error --silent --max-time 25 https://hqventures-govexam-parity-preview.solopreneursid-proy.workers.dev/api/source-status | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{const d=JSON.parse(s);if(d.total!==58||d.checkedSources<1)process.exit(1);console.log("Persisted source check evidence:",d.checkedSources);})'
          curl --fail --show-error --silent --max-time 25 https://hqventures-govexam-radar.solopreneursid-proy.workers.dev/api/catalog | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{const d=JSON.parse(s);if(d.sources.length!==17||d.verifiedListings.length!==0)process.exit(1);console.log("Cloudflare catalog verified",d.sources.length);})'
          curl --fail --show-error --silent --max-time 25 https://hqventures-govexam-radar.solopreneursid-proy.workers.dev/full.css | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{if(s.length<20000||!s.includes(".bg-indigo-600"))process.exit(1);console.log("Self-hosted production CSS verified",s.length);})'
          curl --fail --show-error --silent --max-time 25 https://hqventures-govexam-radar.solopreneursid-proy.workers.dev/ | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{if(!s.includes("Research Preview")||!s.includes("/enhance.js"))process.exit(1);console.log("Six-tab full release HTML verified");})'

      - name: Verify Phase 1 source metadata and UI on isolated Cloudflare preview
        run: |
          curl --fail --show-error --silent --max-time 25 'https://hqventures-govexam-parity-preview.solopreneursid-proy.workers.dev/api/notices?country=India' | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{const d=JSON.parse(s);if(d.filters?.country!=="India"||!Array.isArray(d.notices)||!d.sources?.some(x=>x.id==="india-employment-news"&&x.employerType==="government_recruitment_digest"))process.exit(1);console.log("India official summary API and source classification verified");})'
          curl --fail --show-error --silent --max-time 25 'https://hqventures-govexam-parity-preview.solopreneursid-proy.workers.dev/official.js' | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{if(!s.includes("India Employment News digest")||!s.includes("India · Employment News digest"))process.exit(1);console.log("India label and mobile UI source available");})'
          curl --fail --show-error --silent --max-time 25 'https://hqventures-govexam-parity-preview.solopreneursid-proy.workers.dev/api/ingestion-status' | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{const d=JSON.parse(s);if(!Array.isArray(d.latest)||!Array.isArray(d.automation?.sources)||d.automation.sources.length!==2||typeof d.automation.observedForAllSources!=="boolean")process.exit(1);console.log("Scheduled-ingest audit and independent automation health verified",d.automation.observedForAllSources,d.latest.length);})'
          
      - name: Verify real Cron provenance is distinct from signed one-off transfer
        run: |
          curl --fail --show-error --silent --max-time 25 'https://hqventures-govexam-parity-preview.solopreneursid-proy.workers.dev/api/ingestion-status' | node -e 'let raw="";process.stdin.on("data",c=>raw+=c);process.stdin.on("end",()=>{const d=JSON.parse(raw),a=d.automation||{},s=a.sources||[];if(s.length!==2||typeof a.signedCollectorVerified!=="boolean"||typeof a.healthy!=="boolean"||typeof a.twoCycleCronGatePassed!=="boolean")process.exit(1);for(const id of ["uk-dfe-teaching-vacancies","manitoba-jobs"]){const source=s.find(x=>x.sourceId===id);if(!source||typeof source.signedCollectorSuccessObserved!=="boolean"||!source.scheduledSuccessObserved||!source.lastSuccessfulScheduledAt||!Number.isSafeInteger(source.recentNativeSuccessCount)||typeof source.twoCycleNativeProof!=="boolean")process.exit(1);}if(!a.signedCollectorVerified)process.exit(1);console.log("Native Cron history and signed ingestion evidence",s.length,"twoCycleGate",a.twoCycleCronGatePassed);});'

      - name: Verify portable collector disabled by default and read-only source plan
        run: |
          node -e 'const origin="https://hqventures-govexam-parity-preview.solopreneursid-proy.workers.dev";Promise.all([fetch(origin+"/api/collector/plan"),fetch(origin+"/api/collector/ingest",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"})]).then(async([a,b])=>{if(a.status!==200||![401,415,503].includes(b.status))process.exit(1);const x=await a.json();if(!Array.isArray(x.sources)||x.sources.length!==2)process.exit(1);console.log("Read-only plan working, unauthenticated mutation denied",b.status);}).catch(()=>process.exit(1));'

      - name: Read-only official Manitoba province RSS compatibility probe
        run: node apps/govexam-radar/probe-manitoba.mjs

      - name: Read-only India Employment News source/robots compatibility probe
        continue-on-error: true
        run: node apps/govexam-radar/probe-india.mjs

      - name: Verify D1 community API on isolated preview
        run: node apps/govexam-radar/community-smoke.mjs
