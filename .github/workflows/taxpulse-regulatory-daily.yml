name: TaxPulse daily regulatory evidence (review only)
on:
  schedule:
    - cron: '47 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/taxpulse-regulatory-daily.yml']
permissions:
  contents: read
concurrency:
  group: taxpulse-daily-evidence
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      evidence_artifact: ${{ steps.digest.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '80230f3288b765ccd63aac90151f208a0087e8b2'
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect official regulatory observations
        working-directory: products/taxpulse-global
        run: node scripts/probe-regulatory-sources.mjs
      - name: Bind report digest to immutable workflow artifact
        id: digest
        working-directory: products/taxpulse-global
        run: |
          digest=$(sha256sum regulatory-probe.json | cut -d ' ' -f 1)
          printf 'name=taxpulse-evidence-sha256-%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.digest.outputs.name }}
          path: products/taxpulse-global/regulatory-probe.json
          if-no-files-found: error
          retention-days: 7
  submit:
    if: github.ref == 'refs/heads/main'
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '80230f3288b765ccd63aac90151f208a0087e8b2'
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.collect.outputs.evidence_artifact }}
          path: products/taxpulse-global
      - name: Submit evidence only to the isolated preview intake
        working-directory: products/taxpulse-global
        run: node scripts/submit-regulatory-artifact.mjs regulatory-probe.json
