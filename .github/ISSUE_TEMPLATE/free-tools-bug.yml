name: Free Tool bug report
description: Report a reproducible issue in a published YorpHives Free Tool.
title: "[Free Tools] "
body:
  - type: markdown
    attributes:
      value: "Do not upload private files, passwords, personal data or confidential screenshots. Use synthetic sample data when possible."
  - type: input
    id: tool
    attributes:
      label: Affected tool URL
      placeholder: https://yorphives.com/tools/word-counter/
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Tool will not open or crashes
        - Output is wrong or unusable
        - Security or privacy concern (avoid disclosing exploit details publicly)
        - Mobile, accessibility or browser problem
        - Speed or large-file failure
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce with non-sensitive inputs
      placeholder: "1. Open the tool. 2. Enter synthetic text. 3. Click Convert."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and error
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser, OS and device type
      placeholder: "Firefox on Android"
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not included passwords, private documents, access tokens, or personal identifiers.
          required: true
